<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lasser Beats - Control Operativo de Inventario</title>
  <style>
    /* RESET Y ESTILOS GENERALES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; /* Evita el scroll global de la ventana */
      padding: 15px 25px;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    header h1 {
      color: #00e676;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    header p {
      color: #00c853;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background-color: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background-color: #00e676;
      color: #000;
      border-color: #00e676;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action:hover {
      border-color: #00e676;
      color: #fff;
    }

    /* CONTENEDOR PRINCIPAL DOS COLUMNAS */
    .main-container {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 0; /* Necesario para contener el scroll interno */
    }

    /* COLUMNA IZQUIERDA (Fija) */
    .sidebar-left {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .card-panel {
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
    }

    /* INVERSIÓN ACUMULADA */
    .inversion-title {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      font-weight: bold;
    }

    .inversion-monto {
      font-size: 1.8rem;
      color: #00e676;
      font-weight: bold;
      margin: 5px 0;
    }

    .inversion-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 10px;
    }

    .distribucion-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-top: 5px;
      color: #bbb;
    }

    /* FORMULARIO DE REGISTRO */
    .form-title {
      color: #00e676;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 5px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #00e676;
    }

    .btn-file {
      background-color: #1a1a1a;
      border: 1px dashed #444;
      color: #aaa;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      font-size: 0.8rem;
    }

    .btn-file:hover {
      border-color: #00e676;
      color: #fff;
    }

    .btn-guardar {
      background-color: #00e676;
      color: #000;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-guardar:hover {
      background-color: #00c853;
    }

    /* COLUMNA DERECHA (Galería con Scroll Independiente) */
    .galeria-panel {
      flex: 1;
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .galeria-header {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FILTROS Y BUSCADOR */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 0.85rem;
    }

    .category-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .pill {
      background-color: #1a1a1a;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      border-color: #00e676;
    }

    /* ÁREA CON SCROLL INDEPENDIENTE */
    .equipos-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    .grid-equipos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    /* TARJETA DE EQUIPO */
    .card-equipo {
      background-color: #181818;
      border: 1px solid #282828;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background-color: #0a0a0a;
    }

    .card-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-nombre {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-info {
      font-size: 0.7rem;
      color: #888;
      margin-bottom: 2px;
    }

    .card-subtotal {
      font-size: 0.85rem;
      color: #00e676;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 5px;
      margin-top: auto;
    }

    .btn-card {
      flex: 1;
      padding: 5px;
      font-size: 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    .btn-editar {
      background-color: #2196f3;
      color: #fff;
    }

    .btn-eliminar {
      background-color: #3a1515;
      color: #ff5252;
      border: 1px solid #5c1d1d;
    }

    /* SCROLLBAR PERSONALIZADO */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00e676;
    }
  </style>
</head>
<body>

  <header>
    <h1>LASSER BEATS</h1>
    <p>CONTROL OPERATIVO DE INVENTARIO</p>
  </header>

  <div class="top-bar">
    <div class="nav-tabs">
      <button class="tab-btn active">📦 Inventario General</button>
      <button class="tab-btn">📋 Checklist / Eventos Simultáneos</button>
    </div>
    <div class="action-buttons">
      <button class="btn-action" onclick="exportarCSV()">📊 Exportar Reporte (.csv)</button>
      <button class="btn-action" onclick="guardarCopiaJSON()">💾 Guardar Copia (.json)</button>
      <button class="btn-action" onclick="document.getElementById('inputJson').click()">📂 Cargar Copia (.json)</button>
      <input type="file" id="inputJson" accept=".json" style="display:none;" onchange="cargarCopiaJSON(event)">
    </div>
  </div>

  <div class="main-container">

    <aside class="sidebar-left">
      
      <div class="card-panel">
        <div class="inversion-title">Inversión Acumulada</div>
        <div class="inversion-monto" id="txtInversionTotal">Q0.00</div>
        <div class="inversion-stats">
          <span>Items: <strong id="txtTotalItems">0</strong></span>
          <span>Unidades: <strong id="txtTotalUnidades">0 u.</strong></span>
        </div>
        <hr style="border-color:#222; margin: 8px 0;">
        <div style="font-size: 0.7rem; color: #777; font-weight: bold; margin-bottom: 5px;">DISTRIBUCIÓN DE INVERSIÓN</div>
        <div id="distribucionCategorias"></div>
      </div>

      <div class="card-panel">
        <div class="form-title"><span>+</span> Registrar Equipo</div>
        
        <form id="formEquipo" onsubmit="guardarEquipo(event)">
          <div class="form-group">
            <label>Nombre del Equipo / Nombre</label>
            <input type="text" id="nombreEquipo" class="form-control" placeholder="Ej. Bocina Behringer B15X" required>
          </div>

          <div class="form-group">
            <label>Categoría</label>
            <select id="categoriaEquipo" class="form-control" required>
              <option value="Audio">Audio</option>
              <option value="Video">Video</option>
              <option value="Iluminación">Iluminación</option>
              <option value="Estructuras">Estructuras</option>
              <option value="Accesorios / Cables">Accesorios / Cables</option>
            </select>
          </div>

          <div class="form-group">
            <label>Marca</label>
            <input type="text" id="marcaEquipo" class="form-control" placeholder="Ej. Behringer, Steren, Epson, SKP...">
          </div>

          <div class="form-group">
            <label>Modelo</label>
            <input type="text" id="modeloEquipo" class="form-control" placeholder="Ej. EUROLIVE B15X, Powerlite 95...">
          </div>

          <div class="form-group">
            <label>Precio Unitario (Q)</label>
            <input type="number" step="0.01" id="precioEquipo" class="form-control" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label>Cantidad de Unidades</label>
            <input type="number" id="cantidadEquipo" class="form-control" value="1" min="1" required>
          </div>

          <div class="form-group">
            <label>Fecha de Compra</label>
            <input type="date" id="fechaEquipo" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Fotografía de Control</label>
            <button type="button" class="btn-file" onclick="document.getElementById('fotoEquipo').click()">📷 Capturar o Elegir Imagen</button>
            <input type="file" id="fotoEquipo" accept="image/*" style="display:none;" onchange="procesarFoto(event)">
            <span id="lblFotoEstado" style="font-size: 0.7rem; color: #00e676; display: block; margin-top: 4px;"></span>
          </div>

          <button type="submit" class="btn-guardar">Guardar en Base Local</button>
        </form>
      </div>

    </aside>

    <main class="galeria-panel">
      <div class="galeria-header">
        <span>📦</span> Galería de Equipos en Resguardo
      </div>

      <div class="filter-bar">
        <input type="text" id="inputBuscar" class="search-input" placeholder="🔍 Buscar por nombre, marca o modelo..." oninput="renderizarGaleria()">
      </div>

      <div class="category-pills">
        <button class="pill active" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="pill" onclick="filtrarCategoria('Audio', this)">Audio</button>
        <button class="pill" onclick="filtrarCategoria('Video', this)">Video</button>
        <button class="pill" onclick="filtrarCategoria('Iluminación', this)">Iluminación</button>
        <button class="pill" onclick="filtrarCategoria('Estructuras', this)">Estructuras</button>
        <button class="pill" onclick="filtrarCategoria('Accesorios / Cables', this)">Accesorios / Cables</button>
      </div>

      <div class="equipos-scroll-area">
        <div class="grid-equipos" id="gridEquipos">
          </div>
      </div>
    </main>

  </div>

  <script>
    // ESTADO GLOBAL DE LA APLICACIÓN
    let equipos = JSON.parse(localStorage.getItem('lasser_beats_inventario')) || [];
    let fotoBase64 = "";
    let categoriaSeleccionada = "Todas";

    // ESTABLECER FECHA ACTUAL POR DEFECTO
    document.getElementById('fechaEquipo').valueAsDate = new Date();

    // PROCESAR FOTO A BASE64
    function procesarFoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoBase64 = e.target.result;
          document.getElementById('lblFotoEstado').innerText = "✓ Imagen seleccionada";
        };
        reader.readAsDataURL(file);
      }
    }

    // GUARDAR O EDITAR EQUIPO
    function guardarEquipo(e) {
      e.preventDefault();

      const nuevoEquipo = {
        id: Date.now(),
        nombre: document.getElementById('nombreEquipo').value,
        categoria: document.getElementById('categoriaEquipo').value,
        marca: document.getElementById('marcaEquipo').value || "N/A",
        modelo: document.getElementById('modeloEquipo').value || "N/A", // Se guarda el modelo
        precio: parseFloat(document.getElementById('precioEquipo').value) || 0,
        cantidad: parseInt(document.getElementById('cantidadEquipo').value) || 1,
        fecha: document.getElementById('fechaEquipo').value,
        imagen: fotoBase64 || "https://via.placeholder.com/200x120/1a1a1a/888888?text=Sin+Foto"
      };

      equipos.unshift(nuevoEquipo);
      guardarEnLocalStorage();

      // Limpiar Formulario
      document.getElementById('formEquipo').reset();
      document.getElementById('fechaEquipo').valueAsDate = new Date();
      fotoBase64 = "";
      document.getElementById('lblFotoEstado').innerText = "";

      actualizarTodo();
    }

    // ELIMINAR EQUIPO
    function eliminarEquipo(id) {
      if (confirm("¿Estás seguro de que deseas eliminar este equipo del inventario?")) {
        equipos = equipos.filter(item => item.id !== id);
        guardarEnLocalStorage();
        actualizarTodo();
      }
    }

    // GUARDAR EN LOCALSTORAGE
    function guardarEnLocalStorage() {
      localStorage.setItem('lasser_beats_inventario', JSON.stringify(equipos));
    }

    // FILTRAR CATEGORÍA
    function filtrarCategoria(cat, btn) {
      categoriaSeleccionada = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderizarGaleria();
    }

    // RENDERIZAR GALERÍA DE TARJETAS
    function renderizarGaleria() {
      const grid = document.getElementById('gridEquipos');
      const textoBusqueda = document.getElementById('inputBuscar').value.toLowerCase();

      grid.innerHTML = "";

      const equiposFiltrados = equipos.filter(item => {
        const coincideCat = (categoriaSeleccionada === "Todas") || (item.categoria === categoriaSeleccionada);
        const coincideBusqueda = item.nombre.toLowerCase().includes(textoBusqueda) || 
                                 item.marca.toLowerCase().includes(textoBusqueda) ||
                                 (item.modelo && item.modelo.toLowerCase().includes(textoBusqueda));
        return coincideCat && coincideBusqueda;
      });

      if (equiposFiltrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">No hay equipos registrados en esta vista.</div>`;
        return;
      }

      equiposFiltrados.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        const card = document.createElement('div');
        card.className = 'card-equipo';
        card.innerHTML = `
          <img src="${item.imagen}" class="card-img" alt="${item.nombre}">
          <div class="card-body">
            <div class="card-nombre">${item.nombre}</div>
            <div class="card-info">Marca: <strong>${item.marca}</strong></div>
            <div class="card-info">Modelo: <strong>${item.modelo || 'N/A'}</strong></div>
            <div class="card-info">Categoría: ${item.categoria}</div>
            <div class="card-info">Cantidad: ${item.cantidad} u.</div>
            <div class="card-info">Compra: ${item.fecha}</div>
            <div class="card-subtotal">Subtotal: Q${subtotal.toFixed(2)}</div>
            <div class="card-actions">
              <button class="btn-card btn-eliminar" onclick="eliminarEquipo(${item.id})">🗑️ Eliminar</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ACTUALIZAR ESTADÍSTICAS E INVERSIÓN
    function actualizarEstadisticas() {
      let totalMonto = 0;
      let totalUnidades = 0;
      let desglose = {
        'Audio': 0,
        'Video': 0,
        'Iluminación': 0,
        'Estructuras': 0,
        'Accesorios / Cables': 0
      };

      equipos.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        totalMonto += subtotal;
        totalUnidades += item.cantidad;
        if (desglose.hasOwnProperty(item.categoria)) {
          desglose[item.categoria] += subtotal;
        }
      });

      document.getElementById('txtInversionTotal').innerText = `Q${totalMonto.toFixed(2)}`;
      document.getElementById('txtTotalItems').innerText = equipos.length;
      document.getElementById('txtTotalUnidades').innerText = `${totalUnidades} u.`;

      // Renderizar desglose
      const contenedorDist = document.getElementById('distribucionCategorias');
      contenedorDist.innerHTML = "";
      for (const [cat, monto] of Object.entries(desglose)) {
        const porcentaje = totalMonto > 0 ? ((monto / totalMonto) * 100).toFixed(1) : 0;
        contenedorDist.innerHTML += `
          <div class="distribucion-item">
            <span>${cat}</span>
            <span><strong>Q${monto.toFixed(2)}</strong> (${porcentaje}%)</span>
          </div>
        `;
      }
    }

    // RESPALDOS DE INFORMACIÓN
    function exportarCSV() {
      if (equipos.length === 0) return alert("No hay datos para exportar.");
      let csv = "ID,Nombre,Categoria,Marca,Modelo,PrecioUnitario,Cantidad,Subtotal,Fecha\n";
      equipos.forEach(i => {
        csv += `"${i.id}","${i.nombre}","${i.categoria}","${i.marca}","${i.modelo || 'N/A'}",${i.precio},${i.cantidad},${i.precio * i.cantidad},"${i.fecha}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `LasserBeats_Inventario_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function guardarCopiaJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(equipos, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `LasserBeats_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function cargarCopiaJSON(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            equipos = JSON.parse(e.target.result);
            guardarEnLocalStorage();
            actualizarTodo();
            alert("¡Copia de seguridad cargada con éxito!");
          } catch (err) {
            alert("Error al leer el archivo .json");
          }
        };
        reader.readAsText(file);
      }
    }

    function actualizarTodo() {
      actualizarEstadisticas();
      renderizarGaleria();
    }

    // INICIALIZACIÓN
    actualizarTodo();
  </script>
</body>
</html>
