<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e676">
    <title>Inventario Permanente - Lasser Beats</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.jpg">

    <style>
        :root {
            --bg-principal: #0a0a0a;
            --bg-tarjeta: #121212;
            --bg-input: #1a1a1a;
            --borde: #242424;
            --neon-verde: #00e676;
            --neon-verde-hover: #00b359;
            --azul-editar: #2196f3;
            --azul-editar-hover: #1976d2;
            --rojo-eliminar: #f44336;
            --texto-blanco: #ffffff;
            --texto-gris: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-blanco); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 20px; }
        
        header { text-align: center; padding: 10px 0 5px 0; }
        header h1 { font-size: 2.2rem; text-shadow: 0 0 12px var(--neon-verde); letter-spacing: 1.5px; }
        .subtitle { color: var(--neon-verde); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; font-weight: 600; }
        
        /* PESTAÑAS NAVEGACIÓN PRINCIPAL */
        .tabs-navegacion { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; }
        .btn-tab { background-color: var(--bg-tarjeta); border: 1px solid var(--borde); color: var(--texto-gris); padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-tab.activo { background-color: var(--neon-verde); color: #000; border-color: var(--neon-verde); }

        .card-server-status { 
            background-color: var(--bg-tarjeta); 
            border: 1px solid #1f2c25; 
            border-radius: 12px; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
        }
        .backup-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-backup { background-color: var(--bg-input); border: 1px solid var(--borde); color: var(--texto-blanco); padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
        .btn-backup:hover { background-color: var(--neon-verde); color: #000000; border-color: var(--neon-verde); }
        .btn-excel { border-color: #2e7d32; }
        .btn-excel:hover { background-color: #2e7d32; color: #fff; border-color: #2e7d32; }

        .main-layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
        .sidebar-panel { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px; }

        .card-inversion { background-color: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card-inversion h3 { font-size: 0.85rem; color: var(--texto-gris); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .card-inversion .monto { font-size: 2.4rem; font-weight: 700; color: var(--neon-verde); }
        .card-inversion .stats-secundarias { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borde); font-size: 0.85rem; color: var(--texto-gris); }

        /* DESGLOSE DE CATEGORÍAS */
        .desglose-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--borde); display: flex; flex-direction: column; gap: 8px; }
        .desglose-titulo { font-size: 0.75rem; color: var(--texto-gris); text-transform: uppercase; letter-spacing: 0.5px; }
        .desglose-item { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; }
        .desglose-info { display: flex; justify-content: space-between; color: #dddddd; }
        .barra-progreso-bg { width: 100%; height: 6px; background-color: var(--bg-input); border-radius: 3px; overflow: hidden; }
        .barra-progreso-fill { height: 100%; background-color: var(--neon-verde); border-radius: 3px; width: 0%; transition: width 0.4s ease; }

        .card-formulario, .card-lista, .card-eventos { background-color: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card-formulario h2, .card-lista h2, .card-eventos h2 { font-size: 1.2rem; color: var(--texto-blanco); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .card-formulario h2 span, .card-eventos h2 span { color: var(--neon-verde); }
        
        .form-container { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { color: var(--texto-gris); font-size: 0.8rem; font-weight: 500; }
        .form-group input, .form-group select { background-color: var(--bg-input); border: 1px solid var(--borde); border-radius: 6px; padding: 10px 12px; color: var(--texto-blanco); font-size: 0.95rem; outline: none; width: 100%; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--neon-verde); }
        
        .file-input-wrapper { border: 1px dashed var(--borde); border-radius: 6px; padding: 12px; text-align: center; background-color: var(--bg-input); cursor: pointer; transition: all 0.2s; }
        .file-input-wrapper:hover { border-color: var(--neon-verde); }
        .file-input-wrapper input[type="file"] { display: none; }
        .file-input-wrapper label { cursor: pointer; color: var(--texto-gris); font-size: 0.85rem; }
        
        .btn-submit { background-color: var(--neon-verde); color: #000000; border: none; border-radius: 6px; padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 5px; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: var(--neon-verde-hover); }
        .btn-cancelar { background-color: #333; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 0.85rem; cursor: pointer; margin-top: 5px; display: none; }

        /* BARRA DE BÚSQUEDA Y FILTROS */
        .header-catalogo { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .busqueda-container { display: grid; grid-template-columns: 1fr 200px; gap: 10px; }
        .busqueda-input, .ordenar-select { background-color: var(--bg-input); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 14px; color: var(--texto-blanco); font-size: 0.9rem; outline: none; }
        .busqueda-input:focus, .ordenar-select:focus { border-color: var(--neon-verde); }
        
        .filtros-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .btn-filtro { background-color: var(--bg-input); border: 1px solid var(--borde); color: var(--texto-gris); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-filtro.activo, .btn-filtro:hover { background-color: var(--neon-verde); color: #000; border-color: var(--neon-verde); font-weight: 600; }

        /* REJILLA Y TARJETAS INVENTARIO */
        .equipos-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .equipo-item { background-color: var(--bg-input); border: 1px solid var(--borde); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
        .equipo-foto-container { width: 100%; height: 150px; border-radius: 6px; background-color: var(--bg-principal); border: 1px solid var(--borde); display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; }
        .equipo-foto-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
        .equipo-foto-container:hover img { transform: scale(1.05); }
        
        .equipo-detalles { display: flex; flex-direction: column; gap: 4px; }
        .equipo-titulo { font-size: 1.05rem; font-weight: 600; color: var(--texto-blanco); line-height: 1.3; }
        .equipo-meta { font-size: 0.8rem; color: var(--texto-gris); display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
        .equipo-precio-total { font-size: 1.1rem; font-weight: 700; color: var(--neon-verde); border-top: 1px solid var(--borde); padding-top: 8px; }
        
        .acciones-tarjeta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-editar { background-color: rgba(33, 150, 243, 0.1); border: 1px solid rgba(33, 150, 243, 0.25); color: var(--azul-editar); border-radius: 6px; padding: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-editar:hover { background-color: var(--azul-editar); color: #fff; }
        .btn-eliminar { background-color: rgba(244, 67, 54, 0.08); border: 1px solid rgba(244, 67, 54, 0.15); color: var(--rojo-eliminar); border-radius: 6px; padding: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-eliminar:hover { background-color: var(--rojo-eliminar); color: #fff; }

        /* ESTILOS DE MÓDULO CHECKLIST / EVENTOS */
        .seccion-modulo { display: none; }
        .seccion-modulo.activa { display: block; }

        .tarjeta-evento { background-color: var(--bg-input); border: 1px solid var(--borde); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
        .evento-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); padding-bottom: 10px; margin-bottom: 15px; }
        .evento-titulo { font-size: 1.2rem; font-weight: 700; color: var(--neon-verde); }
        .evento-fecha { font-size: 0.85rem; color: var(--texto-gris); background: var(--bg-principal); padding: 4px 10px; border-radius: 4px; }

        .lista-checklist { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .item-checklist { display: flex; align-items: center; justify-content: space-between; background: var(--bg-tarjeta); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--borde); }
        .item-checklist.cargado { border-color: var(--neon-verde); opacity: 0.6; text-decoration: line-through; }
        .item-check-left { display: flex; align-items: center; gap: 12px; }
        .item-check-left input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--neon-verde); cursor: pointer; }

        .form-asignar-equipo { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--borde); }
        .form-asignar-equipo select, .form-asignar-equipo input { background: var(--bg-principal); border: 1px solid var(--borde); color: #fff; padding: 8px; border-radius: 6px; }

        /* MODAL DE VISUALIZACIÓN */
        .modal-foto { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; }
        .modal-foto img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,230,118,0.3); }
        .modal-cerrar { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 30px; font-weight: bold; cursor: pointer; }

        @media (max-width: 850px) {
            body { padding: 12px; }
            .main-layout { grid-template-columns: 1fr; }
            .sidebar-panel { position: relative; top: 0; }
            .busqueda-container { grid-template-columns: 1fr; }
            .form-asignar-equipo { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>LASSER BEATS</h1>
            <div class="subtitle">Control Operativo de Inventario</div>
        </header>

        <!-- PESTAÑAS DE NAVEGACIÓN -->
        <div class="tabs-navegacion">
            <button class="btn-tab activo" onclick="cambiarModulo('inventario', this)">📦 Inventario General</button>
            <button class="btn-tab" onclick="cambiarModulo('checklist', this)">📋 Checklist / Eventos Simultáneos</button>
        </div>

        <div class="card-server-status">
            <div class="backup-controls">
                <button class="btn-backup btn-excel" onclick="exportarCSV()">📊 Exportar Reporte (.csv)</button>
                <button class="btn-backup" onclick="exportarBackup()">📤 Guardar Copia (.json)</button>
                <button class="btn-backup" onclick="document.getElementById('importarInput').click()">📥 Cargar Copia (.json)</button>
                <input type="file" id="importarInput" accept=".json" style="display: none;" onchange="importarBackup(this)">
            </div>
        </div>

        <!-- MÓDULO 1: INVENTARIO GENERAL -->
        <div id="moduloInventario" class="seccion-modulo activa">
            <div class="main-layout">
                <div class="sidebar-panel">
                    <div class="card-inversion">
                        <h3>Inversión Acumulada</h3>
                        <div class="monto" id="totalInversion">Q0.00</div>
                        <div class="stats-secundarias">
                            <span>Items: <strong id="totalItemsCount" style="color: #fff;">0</strong></span>
                            <span>Unidades: <strong id="totalUnidadesCount" style="color: #fff;">0 u.</strong></span>
                        </div>
                        <div class="desglose-container" id="desgloseCategorias"></div>
                    </div>

                    <main class="card-formulario">
                        <h2 id="tituloFormulario"><span>+</span> Registrar Equipo</h2>
                        <form id="formInventario" class="form-container">
                            <input type="hidden" id="equipoIdEditando" value="">

                            <div class="form-group">
                                <label for="nombreEquipo">Nombre del Equipo / Modelo</label>
                                <input type="text" id="nombreEquipo" placeholder="Ej. Bocina B15X" required>
                            </div>
                            <div class="form-group">
                                <label for="categoriaEquipo">Categoría</label>
                                <select id="categoriaEquipo">
                                    <option value="Audio">Audio</option>
                                    <option value="Video">Video</option>
                                    <option value="Iluminación">Iluminación</option>
                                    <option value="Estructuras">Estructuras</option>
                                    <option value="Accesorios / Cables">Accesorios / Cables</option>
                                </select>
                            </div>
                            <!-- NUEVO CAMPO MARCA -->
                            <div class="form-group">
                                <label for="marcaEquipo">Marca</label>
                                <input type="text" id="marcaEquipo" placeholder="Ej. Behringer, Steren, Epson, SKP..." required>
                            </div>
                            <div class="form-group">
                                <label for="precioUnitario">Precio Unitario (Q)</label>
                                <input type="number" id="precioUnitario" step="0.01" placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="cantidadEquipo">Cantidad de Unidades</label>
                                <input type="number" id="cantidadEquipo" value="1" min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaCompra">Fecha de Compra</label>
                                <input type="date" id="fechaCompra" required>
                            </div>
                            <div class="form-group">
                                <label>Fotografía de Control</label>
                                <div class="file-input-wrapper">
                                    <label for="fotoEquipo" id="labelFoto">📷 Capturar o Elegir Imagen</label>
                                    <input type="file" id="fotoEquipo" accept="image/*">
                                </div>
                            </div>
                            <button type="submit" id="btnSubmit" class="btn-submit">Guardar en Base Local</button>
                            <button type="button" id="btnCancelarEdicion" class="btn-cancelar" onclick="cancelarEdicion()">Cancelar Edición</button>
                        </form>
                    </main>
                </div>

                <section class="card-lista">
                    <div class="header-catalogo">
                        <h2>📋 Galería de Equipos en Resguardo</h2>
                        <div class="busqueda-container">
                            <input type="text" id="inputBuscador" class="busqueda-input" placeholder="🔍 Buscar por nombre o marca..." oninput="filtrarEquipos()">
                            <select id="selectOrden" class="ordenar-select" onchange="filtrarEquipos()">
                                <option value="recientes">Más Recientes Primero</option>
                                <option value="antiguos">Más Antiguos Primero</option>
                                <option value="subtotal-desc">Mayor Inversión</option>
                                <option value="subtotal-asc">Menor Inversión</option>
                                <option value="nombre-asc">Nombre (A - Z)</option>
                            </select>
                        </div>
                        <div class="filtros-container">
                            <button class="btn-filtro activo" onclick="filtrarCategoria('Todas', this)">Todas</button>
                            <button class="btn-filtro" onclick="filtrarCategoria('Audio', this)">Audio</button>
                            <button class="btn-filtro" onclick="filtrarCategoria('Video', this)">Video</button>
                            <button class="btn-filtro" onclick="filtrarCategoria('Iluminación', this)">Iluminación</button>
                            <button class="btn-filtro" onclick="filtrarCategoria('Estructuras', this)">Estructuras</button>
                            <button class="btn-filtro" onclick="filtrarCategoria('Accesorios / Cables', this)">Accesorios / Cables</button>
                        </div>
                    </div>
                    <div class="equipos-container" id="equiposLista"></div>
                </section>
            </div>
        </div>

        <!-- MÓDULO 2: CHECKLIST Y SALIDAS DE EVENTOS -->
        <div id="moduloChecklist" class="seccion-modulo">
            <div class="main-layout">
                <div class="sidebar-panel">
                    <div class="card-formulario">
                        <h2><span>📅</span> Agendar Evento</h2>
                        <form id="formEvento" class="form-container">
                            <div class="form-group">
                                <label for="nombreEvento">Nombre del Evento / Cliente</label>
                                <input type="text" id="nombreEvento" placeholder="Ej. Boda - Salón Gran Plaza" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaEvento">Fecha del Evento</label>
                                <input type="date" id="fechaEvento" required>
                            </div>
                            <button type="submit" class="btn-submit">Crear Hoja de Despacho</button>
                        </form>
                    </div>
                </div>

                <section class="card-eventos">
                    <h2>🚚 Despacho de Carga para Eventos</h2>
                    <div id="listaEventos"></div>
                </section>
            </div>
        </div>

    </div>

    <!-- MODAL FOTO -->
    <div id="modalFoto" class="modal-foto" onclick="cerrarModalFoto()">
        <span class="modal-cerrar">&times;</span>
        <img id="imgModal" src="" alt="Vista Previa">
    </div>

    <script>
        let db;
        let fotoBase64Temp = "";
        let listaEquiposCompleta = [];
        let listaEventosCompleta = [];
        let categoriaSeleccionada = "Todas";

        document.getElementById('fechaCompra').valueAsDate = new Date();
        document.getElementById('fechaEvento').valueAsDate = new Date();

        // Convertir imagen a Base64
        document.getElementById('fotoEquipo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    fotoBase64Temp = evt.target.result;
                    document.getElementById('labelFoto').textContent = "📷 Imagen Seleccionada";
                };
                reader.readAsDataURL(file);
            }
        });

        const request = indexedDB.open("LasserBeatsInventarioDB", 2);
        request.onerror = function(event) { console.error("Error en IndexedDB", event); };
        request.onsuccess = function(event) { db = event.target.result; cargarInventario(); cargarEventos(); };
        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("equipos")) {
                db.createObjectStore("equipos", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("eventos")) {
                db.createObjectStore("eventos", { keyPath: "id", autoIncrement: true });
            }
        };

        function cambiarModulo(modulo, btn) {
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('activo'));
            document.querySelectorAll('.seccion-modulo').forEach(m => m.classList.remove('activa'));
            btn.classList.add('activo');
            
            if(modulo === 'inventario') document.getElementById('moduloInventario').classList.add('activa');
            if(modulo === 'checklist') document.getElementById('moduloChecklist').classList.add('activa');
        }

        // --- SUBMIT DE INVENTARIO (CREAR Y EDITAR) ---
        document.getElementById('formInventario').addEventListener('submit', function(e) {
            e.preventDefault();
            const idEditando = document.getElementById('equipoIdEditando').value;
            
            const equipoData = {
                nombre: document.getElementById('nombreEquipo').value,
                categoria: document.getElementById('categoriaEquipo').value,
                marca: document.getElementById('marcaEquipo').value || "Genérico",
                precio: parseFloat(document.getElementById('precioUnitario').value) || 0,
                cantidad: parseInt(document.getElementById('cantidadEquipo').value) || 1,
                fecha: document.getElementById('fechaCompra').value,
                foto: fotoBase64Temp
            };

            const transaction = db.transaction(["equipos"], "readwrite");
            const store = transaction.objectStore("equipos");

            if (idEditando) {
                equipoData.id = parseInt(idEditando);
                store.put(equipoData).onsuccess = function() {
                    cancelarEdicion();
                    cargarInventario();
                };
            } else {
                store.add(equipoData).onsuccess = function() {
                    cancelarEdicion();
                    cargarInventario();
                };
            }
        });

        function prepararEdicion(id) {
            const equipo = listaEquiposCompleta.find(e => e.id === id);
            if (!equipo) return;

            document.getElementById('equipoIdEditando').value = equipo.id;
            document.getElementById('nombreEquipo').value = equipo.nombre;
            document.getElementById('categoriaEquipo').value = equipo.categoria;
            document.getElementById('marcaEquipo').value = equipo.marca || "";
            document.getElementById('precioUnitario').value = equipo.precio;
            document.getElementById('cantidadEquipo').value = equipo.cantidad;
            document.getElementById('fechaCompra').value = equipo.fecha;
            
            fotoBase64Temp = equipo.foto || "";
            document.getElementById('labelFoto').textContent = fotoBase64Temp ? "📷 Imagen Actual Cargada" : "📷 Capturar o Elegir Imagen";

            document.getElementById('tituloFormulario').innerHTML = "<span>✏️</span> Editar Equipo";
            document.getElementById('btnSubmit').textContent = "Actualizar Cambios";
            document.getElementById('btnCancelarEdicion').style.display = "block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('formInventario').reset();
            document.getElementById('equipoIdEditando').value = "";
            fotoBase64Temp = "";
            document.getElementById('labelFoto').textContent = "📷 Capturar o Elegir Imagen";
            document.getElementById('fechaCompra').valueAsDate = new Date();

            document.getElementById('tituloFormulario').innerHTML = "<span>+</span> Registrar Equipo";
            document.getElementById('btnSubmit').textContent = "Guardar en Base Local";
            document.getElementById('btnCancelarEdicion').style.display = "none";
        }

        function eliminarEquipo(id) {
            if (confirm("¿Estás seguro de eliminar este equipo del inventario?")) {
                const transaction = db.transaction(["equipos"], "readwrite");
                transaction.objectStore("equipos").delete(id).onsuccess = function() {
                    cargarInventario();
                };
            }
        }

        // --- CARGAR Y FILTRAR ---
        function cargarInventario() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            objectStore.getAll().onsuccess = function(event) {
                listaEquiposCompleta = event.target.result;
                filtrarEquipos();
                actualizarSelectEquipos();
            };
        }

        function filtrarCategoria(cat, elemento) {
            categoriaSeleccionada = cat;
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            elemento.classList.add('activo');
            filtrarEquipos();
        }

        function filtrarEquipos() {
            const textoBusqueda = document.getElementById('inputBuscador').value.toLowerCase();
            const orden = document.getElementById('selectOrden').value;

            let equiposFiltrados = listaEquiposCompleta.filter(equipo => {
                const coincideNombre = equipo.nombre.toLowerCase().includes(textoBusqueda);
                const coincideMarca = (equipo.marca || "").toLowerCase().includes(textoBusqueda);
                const coincideCat = (categoriaSeleccionada === "Todas") || (equipo.categoria === categoriaSeleccionada);
                return (coincideNombre || coincideMarca) && coincideCat;
            });

            equiposFiltrados.sort((a, b) => {
                const subtotalA = a.precio * a.cantidad;
                const subtotalB = b.precio * b.cantidad;
                if (orden === "recientes") return new Date(b.fecha) - new Date(a.fecha);
                if (orden === "antiguos") return new Date(a.fecha) - new Date(b.fecha);
                if (orden === "subtotal-desc") return subtotalB - subtotalA;
                if (orden === "subtotal-asc") return subtotalA - subtotalB;
                if (orden === "nombre-asc") return a.nombre.localeCompare(b.nombre);
                return 0;
            });

            renderizarEquipos(equiposFiltrados);
        }

        function renderizarEquipos(equipos) {
            const container = document.getElementById('equiposLista');
            container.innerHTML = "";
            let totalMonto = 0;
            let totalUnidades = 0;
            let inversionPorCategoria = {};

            listaEquiposCompleta.forEach(eq => {
                const subtotal = eq.precio * eq.cantidad;
                totalMonto += subtotal;
                totalUnidades += eq.cantidad;
                inversionPorCategoria[eq.categoria] = (inversionPorCategoria[eq.categoria] || 0) + subtotal;
            });

            document.getElementById('totalInversion').textContent = `Q${totalMonto.toFixed(2)}`;
            document.getElementById('totalItemsCount').textContent = listaEquiposCompleta.length;
            document.getElementById('totalUnidadesCount').textContent = `${totalUnidades} u.`;

            const desgloseContainer = document.getElementById('desgloseCategorias');
            desgloseContainer.innerHTML = `<div class="desglose-titulo">Distribución de Inversión</div>`;
            for (const [cat, monto] of Object.entries(inversionPorCategoria)) {
                const porcentaje = totalMonto > 0 ? ((monto / totalMonto) * 100).toFixed(1) : 0;
                desgloseContainer.innerHTML += `
                    <div class="desglose-item">
                        <div class="desglose-info"><span>${cat}</span><strong>Q${monto.toFixed(2)} (${porcentaje}%)</strong></div>
                        <div class="barra-progreso-bg"><div class="barra-progreso-fill" style="width: ${porcentaje}%;"></div></div>
                    </div>
                `;
            }

            if (equipos.length === 0) {
                container.innerHTML = `<div class="sin-equipos" style="color:var(--texto-gris); padding:20px;">No hay equipos registrados en esta lista.</div>`;
                return;
            }

            equipos.forEach(equipo => {
                const subtotal = equipo.precio * equipo.cantidad;
                const html = `
                    <div class="equipo-item">
                        <div>
                            <div class="equipo-foto-container" onclick="abrirModalFoto('${equipo.foto || ''}')">
                                ${equipo.foto ? `<img src="${equipo.foto}" alt="Equipo">` : `<span style="font-size:2rem;">📷</span>`}
                            </div>
                            <div class="equipo-detalles">
                                <div class="equipo-titulo" style="margin-top: 10px;">${equipo.nombre}</div>
                                <div class="equipo-meta">
                                    <span><strong>Marca:</strong> ${equipo.marca || 'N/A'}</span>
                                    <span><strong>Categoría:</strong> ${equipo.categoria}</span>
                                    <span><strong>Cantidad:</strong> ${equipo.cantidad} u.</span>
                                    <span><strong>Compra:</strong> ${formatearFecha(equipo.fecha)}</span>
                                    <span><strong>Costo U:</strong> Q${equipo.precio.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="equipo-precio-total">Subtotal: Q${subtotal.toFixed(2)}</div>
                            <div class="acciones-tarjeta">
                                <button class="btn-editar" onclick="prepararEdicion(${equipo.id})">✏️ Editar</button>
                                <button class="btn-eliminar" onclick="eliminarEquipo(${equipo.id})">🗑️ Eliminar</button>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- MANEJO DE EVENTOS Y CHECKLIST ---
        document.getElementById('formEvento').addEventListener('submit', function(e) {
            e.preventDefault();
            const nuevoEvento = {
                nombre: document.getElementById('nombreEvento').value,
                fecha: document.getElementById('fechaEvento').value,
                equiposAsignados: []
            };

            const transaction = db.transaction(["eventos"], "readwrite");
            transaction.objectStore("eventos").add(nuevoEvento).onsuccess = function() {
                document.getElementById('formEvento').reset();
                document.getElementById('fechaEvento').valueAsDate = new Date();
                cargarEventos();
            };
        });

        function cargarEventos() {
            const transaction = db.transaction(["eventos"], "readonly");
            transaction.objectStore("eventos").getAll().onsuccess = function(event) {
                listaEventosCompleta = event.target.result;
                renderizarEventos();
            };
        }

        function renderizarEventos() {
            const container = document.getElementById('listaEventos');
            container.innerHTML = "";

            if (listaEventosCompleta.length === 0) {
                container.innerHTML = `<div style="color:var(--texto-gris); padding:20px;">No hay eventos creados. Agrega uno a la izquierda.</div>`;
                return;
            }

            listaEventosCompleta.forEach(evento => {
                let htmlEquipos = "";
                evento.equiposAsignados.forEach((item, index) => {
                    htmlEquipos += `
                        <div class="item-checklist ${item.cargado ? 'cargado' : ''}">
                            <div class="item-check-left">
                                <input type="checkbox" ${item.cargado ? 'checked' : ''} onchange="toggleCargaEquipo(${evento.id}, ${index})">
                                <span><strong>${item.cantidad} u.</strong> - ${item.nombre}</span>
                            </div>
                            <button class="btn-eliminar" style="padding: 2px 6px;" onclick="quitarEquipoEvento(${evento.id}, ${index})">✕</button>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="tarjeta-evento">
                        <div class="evento-header">
                            <span class="evento-titulo">🎪 ${evento.nombre}</span>
                            <span class="evento-fecha">📅 ${formatearFecha(evento.fecha)}</span>
                        </div>
                        <div class="lista-checklist">
                            ${htmlEquipos || '<span style="color:#666; font-size:0.85rem;">Sin equipos asignados todavía.</span>'}
                        </div>
                        <div class="form-asignar-equipo">
                            <select id="selectEq_${evento.id}" style="flex:1;">
                                ${generarOptionsEquipos()}
                            </select>
                            <input type="number" id="cantEq_${evento.id}" value="1" min="1" style="width: 70px;">
                            <button class="btn-submit" style="margin:0; width:auto;" onclick="asignarEquipoAEvento(${evento.id})">+ Asignar</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function generarOptionsEquipos() {
            return listaEquiposCompleta.map(eq => `<option value="${eq.nombre}">${eq.nombre} (${eq.marca || 'S/M'}) - Disp: ${eq.cantidad}u</option>`).join('');
        }

        function actualizarSelectEquipos() {
            if(listaEventosCompleta.length > 0) renderizarEventos();
        }

        function asignarEquipoAEvento(eventoId) {
            const nombreEq = document.getElementById(`selectEq_${eventoId}`).value;
            const cantEq = parseInt(document.getElementById(`cantEq_${eventoId}`).value);

            if (!nombreEq) return;

            const evento = listaEventosCompleta.find(e => e.id === eventoId);
            evento.equiposAsignados.push({ nombre: nombreEq, cantidad: cantEq, cargado: false });

            const transaction = db.transaction(["eventos"], "readwrite");
            transaction.objectStore("eventos").put(evento).onsuccess = function() { cargarEventos(); };
        }

        function toggleCargaEquipo(eventoId, indexItem) {
            const evento = listaEventosCompleta.find(e => e.id === eventoId);
            evento.equiposAsignados[indexItem].cargado = !evento.equiposAsignados[indexItem].cargado;

            const transaction = db.transaction(["eventos"], "readwrite");
            transaction.objectStore("eventos").put(evento).onsuccess = function() { cargarEventos(); };
        }

        function quitarEquipoEvento(eventoId, indexItem) {
            const evento = listaEventosCompleta.find(e => e.id === eventoId);
            evento.equiposAsignados.splice(indexItem, 1);

            const transaction = db.transaction(["eventos"], "readwrite");
            transaction.objectStore("eventos").put(evento).onsuccess = function() { cargarEventos(); };
        }

        // --- UTILIDADES ---
        function formatearFecha(fechaStr) {
            if(!fechaStr) return "N/A";
            const partes = fechaStr.split("-");
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
        }

        function abrirModalFoto(src) {
            if(!src) return;
            document.getElementById('imgModal').src = src;
            document.getElementById('modalFoto').style.display = "flex";
        }

        function cerrarModalFoto() {
            document.getElementById('modalFoto').style.display = "none";
        }

        // --- EXPORTACIONES Y RESPALDOS ---
        function exportarCSV() {
            if(listaEquiposCompleta.length === 0) return alert("No hay equipos.");
            let csv = "\uFEFFNombre del Equipo,Marca,Categoria,Cantidad,Fecha,Precio Unitario,Subtotal\n";
            listaEquiposCompleta.forEach(eq => {
                csv += `"${eq.nombre.replace(/"/g, '""')}","${(eq.marca || '').replace(/"/g, '""')}",${eq.categoria},${eq.cantidad},${eq.fecha},${eq.precio.toFixed(2)},${(eq.precio*eq.cantidad).toFixed(2)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Inventario_Lasser_Beats.csv";
            link.click();
        }

        function exportarBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(listaEquiposCompleta, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "backup_inventario_lasser.json";
            a.click();
        }

        function importarBackup(input) {
            const file = input.files[0];
            if (!file) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    const tx = db.transaction(["equipos"], "readwrite");
                    const store = tx.objectStore("equipos");
                    store.clear().onsuccess = function() {
                        datos.forEach(item => { delete item.id; store.add(item); });
                        tx.oncomplete = function() { alert("¡Respaldo cargado con éxito!"); cargarInventario(); };
                    };
                } catch(err) { alert("Archivo JSON no válido."); }
            };
            lector.readAsText(file);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.error(err)));
        }
    </script>
</body>
</html>
