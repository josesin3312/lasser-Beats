<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e676">
    <title>Inventario Permanente - Lasser Beats</title>
    
    <!-- Enlaces vinculados para cargar tu logo local -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.jpg">

    <style>
        /* --- ESTILOS VISUALES (TEMA OSCURO PREMIUM - LASSER BEATS) --- */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
        }
        
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            padding: 20px 15px; 
            display: flex; 
            justify-content: center; 
        }
        
        /* Contenedor principal fluido que se expande en pantallas grandes */
        .app-container { 
            width: 100%; 
            max-width: 1350px; 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
        }
        
        header { 
            text-align: center; 
            padding: 10px 0; 
        }
        
        .subtitle { 
            color: #00e676; 
            font-size: 0.85rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 12px; 
            font-weight: 600; 
        }
        
        /* Panel de control superior */
        .card-server-status { 
            background-color: #121212; 
            border: 1px solid #00e676; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 12px;
        }
        
        .status-text { 
            font-size: 0.9rem; 
            font-weight: bold; 
            color: #00e676; 
        }
        
        .backup-controls { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            width: 100%; 
        }
        
        .btn-backup {
            background-color: #1a1a1a; 
            border: 1px solid #2d2d2d; 
            color: #00e676;
            padding: 10px 16px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            border-radius: 6px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: all 0.2s ease;
        }
        
        .btn-backup:hover { 
            background-color: #00e676; 
            color: #000000; 
            border-color: #00e676; 
        }
        
        /* Tarjeta de Inversión */
        .card-inversion { 
            background-color: #121212; 
            border: 1px solid #1f1f1f; 
            border-radius: 12px; 
            padding: 22px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .card-inversion-info h3 { 
            font-size: 0.95rem; 
            color: #888888; 
            margin-bottom: 5px; 
        }
        
        .card-inversion-info .monto { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: #00e676; 
        }
        
        /* Formulario y Contenedores */
        .card-formulario, .card-lista { 
            background-color: #121212; 
            border: 1px solid #1f1f1f; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .card-formulario h2, .card-lista h2 { 
            font-size: 1.3rem; 
            color: #ffffff; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .card-formulario h2 span { 
            color: #00e676; 
        }
        
        /* Formulario responsivo */
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
        }
        
        .full-width { 
            grid-column: span 2; 
        }
        
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .form-group label { 
            color: #aaaaaa; 
            font-size: 0.85rem; 
        }
        
        .form-group input, .form-group select { 
            background-color: #1a1a1a; 
            border: 1px solid #2d2d2d; 
            border-radius: 6px; 
            padding: 12px; 
            color: #ffffff; 
            font-size: 0.95rem; 
            outline: none; 
            width: 100%; 
        }
        
        .form-group input:focus, .form-group select:focus { 
            border-color: #00e676; 
        }
        
        .file-input-wrapper { 
            border: 1px dashed #2d2d2d; 
            border-radius: 6px; 
            padding: 15px; 
            text-align: center; 
            background-color: #1a1a1a; 
            cursor: pointer; 
        }
        
        .file-input-wrapper input[type="file"] { 
            display: none; 
        }
        
        .file-input-wrapper label { 
            cursor: pointer; 
            color: #888888; 
            font-size: 0.9rem; 
        }
        
        .btn-submit { 
            background-color: #00e676; 
            color: #000000; 
            border: none; 
            border-radius: 6px; 
            padding: 14px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px; 
        }
        
        .btn-submit:hover { 
            background-color: #00b359; 
        }
        
        /* --- REJILLA ADAPTATIVA (SÚPER SOLUCIÓN PARA PANTALLAS GRANDES) --- */
        .equipos-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); 
            gap: 20px; 
        }
        
        /* Diseño tipo Tarjeta / Catálogo */
        .equipo-item { 
            background-color: #1a1a1a; 
            border: 1px solid #2d2d2d; 
            border-radius: 10px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .equipo-foto-container { 
            width: 100%; 
            height: 160px; 
            border-radius: 6px; 
            background-color: #121212; 
            border: 1px solid #2d2d2d; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        
        .equipo-foto-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .equipo-foto-placeholder { 
            color: #444444; 
            font-size: 2rem; 
        }
        
        .equipo-detalles { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .equipo-titulo { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: #ffffff; 
            line-height: 1.3;
        }
        
        .equipo-meta { 
            font-size: 0.85rem; 
            color: #aaaaaa; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            margin-top: 5px;
        }
        
        .equipo-meta strong {
            color: #888888;
        }
        
        .equipo-precio-total { 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: #00e676; 
            border-top: 1px solid #2d2d2d;
            padding-top: 10px;
            margin-top: 4px;
        }
        
        .btn-eliminar { 
            background-color: rgba(244, 67, 54, 0.1); 
            border: 1px solid rgba(244, 67, 54, 0.2); 
            color: #f44336; 
            border-radius: 6px; 
            padding: 10px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            text-align: center;
            width: 100%;
            transition: all 0.2s ease;
        }
        
        .btn-eliminar:hover { 
            background-color: #f44336; 
            color: #ffffff; 
        }
        
        .sin-equipos { 
            text-align: center; 
            color: #666666; 
            padding: 40px 0; 
            grid-column: span 4;
        }

        /* --- CONFIGURACIONES ADAPTATIVAS (MEDIA QUERIES) --- */
        @media (max-width: 767px) {
            body {
                padding: 15px 8px;
            }
            .form-grid { 
                display: flex; 
                flex-direction: column; 
            }
            .equipos-container { 
                grid-template-columns: 1fr; /* Una columna exacta en celulares */
            }
            .backup-controls { 
                flex-direction: column; 
                width: 100%; 
            }
            .btn-backup { 
                justify-content: center; 
                padding: 12px; 
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 style="color: #ffffff; font-size: 1.9rem; text-shadow: 0 0 10px #00e676; letter-spacing: 1px;">LASSER BEATS</h1>
            <div class="subtitle">Sistema de Gestión de Inventario</div>
        </header>

        <!-- PANEL DE MOTOR LOCAL -->
        <div class="card-server-status">
            <span class="status-text">⚡ Motor de Datos: Base de Datos Interna (Activa Offline en este Dispositivo)</span>
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportarBackup()">📤 Guardar Copia de Seguridad (.json)</button>
                <button class="btn-backup" onclick="document.getElementById('importarInput').click()">📥 Cargar Copia de Seguridad (.json)</button>
                <input type="file" id="importarInput" accept=".json" style="display: none;" onchange="importarBackup(this)">
            </div>
        </div>

        <!-- INDICADOR DE INVERSIÓN TOTAL -->
        <div class="card-inversion">
            <div class="card-inversion-info">
                <h3>Inversión Total Acumulada en Equipos</h3>
                <div class="monto" id="totalInversion">Q0.00</div>
            </div>
        </div>

        <!-- FORMULARIO DE INGRESO -->
        <main class="card-formulario">
            <h2><span>+</span> Registrar Nuevo Equipo</h2>
            <form id="formInventario">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombreEquipo">Nombre del Equipo / Modelo</label>
                        <input type="text" id="nombreEquipo" placeholder="Ej. Bocina Behringer B15X" required>
                    </div>
                    <div class="form-group">
                        <label for="categoriaEquipo">Categoría de Trabajo</label>
                        <select id="categoriaEquipo">
                            <option value="Audio">Audio</option>
                            <option value="Iluminación">Iluminación</option>
                            <option value="Estructuras">Estructuras</option>
                            <option value="Accesorios / Cables">Accesorios / Cables</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="precioUnitario">Precio Unitario (Q)</label>
                        <input type="number" id="precioUnitario" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="cantidadEquipo">Cantidad de Unidades</label>
                        <input type="number" id="cantidadEquipo" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="fechaCompra">Fecha de Adquisición</label>
                        <input type="date" id="fechaCompra" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Fotografía de Control</label>
                        <div class="file-input-wrapper">
                            <label for="fotoEquipo" id="labelFoto">Capturar o Elegir Imagen...</label>
                            <input type="file" id="fotoEquipo" accept="image/*">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar en Base Local</button>
            </form>
        </main>

        <!-- MÓDULO CATÁLOGO DE EQUIPOS -->
        <section class="card-lista">
            <h2 style="margin-bottom: 25px;">📋 Galería de Equipos en Resguardo</h2>
            <div class="equipos-container" id="equiposLista"></div>
        </section>
    </div>

    <script>
        let db;
        let fotoBase64 = "";
        document.getElementById('fechaCompra').valueAsDate = new Date();

        // 1. INICIALIZACIÓN DE INDEXEDDB ASÍNCRONA
        const request = indexedDB.open("LasserBeatsInventarioDB", 1);

        request.onerror = function(event) {
            console.error("Error crítico de acceso a base de datos", event);
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            cargarInventario();
        };

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            const objectStore = db.createObjectStore("equipos", { keyPath: "id", autoIncrement: true });
            objectStore.createIndex("nombre", "nombre", { unique: false });
        };

        // Escuchador de carga de fotos fluidas
        document.getElementById('fotoEquipo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('labelFoto').textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(event) { fotoBase64 = event.target.result; };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('labelFoto').textContent = "Capturar o Elegir Imagen...";
                fotoBase64 = "";
            }
        });

        function formatearFecha(fechaStr) {
            if(!fechaStr) return "N/A";
            const partes = fechaStr.split("-");
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
        }

        // 2. EXTRAER DATOS COMPLETO
        function cargarInventario() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                renderizarEquipos(event.target.result);
            };
        }

        // 3. RENDERIZACIÓN ADAPTATIVA OPTIMIZADA
        function renderizarEquipos(equipos) {
            const container = document.getElementById('equiposLista');
            container.innerHTML = "";
            let total = 0;

            if (equipos.length === 0) {
                container.innerHTML = `<div class="sin-equipos">No hay equipos registrados en el almacenamiento local de este dispositivo.</div>`;
                document.getElementById('totalInversion').textContent = "Q0.00";
                return;
            }

            equipos.forEach(equipo => {
                const subtotal = equipo.precio * equipo.cantidad;
                total += subtotal;

                const html = `
                    <div class="equipo-item">
                        <div>
                            <div class="equipo-foto-container">
                                ${equipo.foto ? `<img src="${equipo.foto}" alt="Equipo">` : `<span class="equipo-foto-placeholder">📷</span>`}
                            </div>
                            <div class="equipo-detalles">
                                <div class="equipo-titulo" style="margin-top: 12px;">${equipo.nombre}</div>
                                <div class="equipo-meta">
                                    <span><strong>Categoría:</strong> ${equipo.categoria}</span>
                                    <span><strong>Cantidad:</strong> ${equipo.cantidad} u.</span>
                                    <span><strong>Adquisición:</strong> ${formatearFecha(equipo.fecha)}</span>
                                    <span><strong>Costo U:</strong> Q${equipo.precio.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="equipo-precio-total">Subtotal: Q${subtotal.toFixed(2)}</div>
                            <button class="btn-eliminar" style="margin-top: 12px;" onclick="eliminarEquipo(${equipo.id})">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('totalInversion').textContent = `Q${total.toFixed(2)}`;
        }

        // 4. GUARDADO SEGURO DE REGISTROS
        document.getElementById('formInventario').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoEquipo = {
                nombre: document.getElementById('nombreEquipo').value,
                categoria: document.getElementById('categoriaEquipo').value,
                precio: parseFloat(document.getElementById('precioUnitario').value),
                cantidad: parseInt(document.getElementById('cantidadEquipo').value),
                fecha: document.getElementById('fechaCompra').value,
                foto: fotoBase64
            };

            const transaction = db.transaction(["equipos"], "readwrite");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.add(nuevoEquipo);

            request.onsuccess = function() {
                document.getElementById('formInventario').reset();
                document.getElementById('fechaCompra').valueAsDate = new Date();
                document.getElementById('labelFoto').textContent = "Capturar o Elegir Imagen...";
                fotoBase64 = "";
                cargarInventario();
            };
        });

        // 5. REMOVER REGISTRO
        function eliminarEquipo(id) {
            if (confirm("¿Estás seguro de eliminar este equipo de la memoria local?")) {
                const transaction = db.transaction(["equipos"], "readwrite");
                const objectStore = transaction.objectStore("equipos");
                const request = objectStore.delete(id);

                request.onsuccess = function() {
                    cargarInventario();
                };
            }
        }

        // 6. RESPALDOS LOGÍSTICOS (.JSON)
        function exportarBackup() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                const equipos = event.target.result;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(equipos, null, 2));
                const descargaAnchor = document.createElement('a');
                descargaAnchor.setAttribute("href", dataStr);
                descargaAnchor.setAttribute("download", "backup_inventario_lasser.json");
                document.body.appendChild(descargaAnchor);
                descargaAnchor.click();
                descargaAnchor.remove();
            };
        }

        function importarBackup(input) {
            const file = input.files[0];
            if (!file) return;

            if (!confirm("Atención: Al importar se sobrescribirá la base local actual para sincronizar los datos del archivo. ¿Deseas continuar?")) {
                input.value = "";
                return;
            }

            const lector = new FileReader();
            lector.onload = function(evento) {
                try {
                    const datosImportados = JSON.parse(evento.target.result);
                    const transaction = db.transaction(["equipos"], "readwrite");
                    const objectStore = transaction.objectStore("equipos");
                    const clearRequest = objectStore.clear();
                    
                    clearRequest.onsuccess = function() {
                        datosImportados.forEach(e => {
                            delete e.id; 
                            objectStore.add(e);
                        });
                        
                        transaction.oncomplete = function() {
                            alert("¡Sincronización exitosa! El respaldo ha sido cargado localmente.");
                            cargarInventario();
                        };
                    };
                } catch (err) {
                    alert("Error crítico: El archivo cargado no contiene una estructura de respaldo válida.");
                }
                input.value = "";
            };
            lector.readAsText(file);
        }

        // --- MANIFIESTO DE ASISTENTE DE SERVICIO OFFLINE ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Asistente local en marcha', reg))
                    .catch(err => console.error('Fallo de registro de asistente', err));
            });
        }
    </script>
</body>
</html>
