<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e676">
    <title>Inventario Permanente - Lasser Beats</title>
    
    <!-- Enlaces corregidos para cargar tu logo local -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.jpg">

    <style>
        /* --- ESTILOS VISUALES (TEMA OSCURO LASSER BEATS) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; padding: 20px 10px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 25px; }
        header { text-align: center; padding: 10px 0; }
        .subtitle { color: #00e676; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 15px; font-weight: 600; }
        
        .card-server-status { 
            background-color: #121212; 
            border: 1px solid #00e676; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 12px;
        }
        .status-text { font-size: 0.9rem; font-weight: bold; color: #00e676; }
        .backup-controls { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .btn-backup {
            background-color: #1a1a1a; border: 1px solid #2d2d2d; color: #00e676;
            padding: 8px 14px; font-size: 0.8rem; font-weight: 600; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .btn-backup:hover { background-color: #00e676; color: #000000; border-color: #00e676; }
        
        .card-inversion { 
            background-color: #121212; border: 1px solid #1f1f1f; border-radius: 12px; 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
        }
        .card-inversion-info h3 { font-size: 0.9rem; color: #888888; margin-bottom: 5px; }
        .card-inversion-info .monto { font-size: 2rem; font-weight: 700; color: #00e676; }
        
        .card-formulario, .card-lista { 
            background-color: #121212; border: 1px solid #1f1f1f; border-radius: 12px; padding: 25px; 
        }
        .card-formulario h2, .card-lista h2 { font-size: 1.25rem; color: #ffffff; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .card-formulario h2 span { color: #00e676; }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { color: #aaaaaa; font-size: 0.85rem; }
        .form-group input, .form-group select { 
            background-color: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 6px; padding: 12px; color: #ffffff; font-size: 0.95rem; outline: none; width: 100%; 
        }
        .form-group input:focus, .form-group select:focus { border-color: #00e676; }
        
        .file-input-wrapper { border: 1px dashed #2d2d2d; border-radius: 6px; padding: 15px; text-align: center; background-color: #1a1a1a; cursor: pointer; }
        .file-input-wrapper input[type="file"] { display: none; }
        .file-input-wrapper label { cursor: pointer; color: #888888; font-size: 0.9rem; }
        
        .btn-submit { background-color: #00e676; color: #000000; border: none; border-radius: 6px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #00b359; }
        
        .equipos-container { display: flex; flex-direction: column; gap: 15px; }
        .equipo-item { background-color: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .equipo-foto-container { width: 70px; height: 70px; border-radius: 6px; background-color: #121212; border: 1px solid #2d2d2d; display: flex; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0; }
        .equipo-foto-container img { width: 100%; height: 100%; object-fit: cover; }
        .equipo-foto-placeholder { color: #444444; font-size: 1.5rem; }
        .equipo-detalles { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .equipo-titulo { font-size: 1rem; font-weight: 600; color: #ffffff; }
        .equipo-meta { font-size: 0.8rem; color: #888888; display: flex; flex-wrap: wrap; gap: 10px; }
        .equipo-precio-total { font-size: 1.05rem; font-weight: 700; color: #00e676; }
        
        .btn-eliminar { background-color: rgba(244, 67, 54, 0.1); border: 1px solid rgba(244, 67, 54, 0.2); color: #f44336; border-radius: 6px; padding: 8px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .btn-eliminar:hover { background-color: #f44336; color: #ffffff; }
        .sin-equipos { text-align: center; color: #666666; padding: 30px 0; }

        @media (max-width: 767px) {
            .form-grid { display: flex; flex-direction: column; }
            .equipo-item { flex-direction: column; align-items: flex-start; }
            .equipo-foto-container { width: 100%; height: 140px; }
            .btn-eliminar { width: 100%; text-align: center; }
            .backup-controls { flex-direction: column; width: 100%; }
            .btn-backup { justify-content: center; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 style="color: #ffffff; font-size: 1.8rem; text-shadow: 0 0 10px #00e676;">LASSER BEATS</h1>
            <div class="subtitle">Inventario Offline con Base de Datos Local</div>
        </header>

        <!-- CONTROLADORES -->
        <div class="card-server-status">
            <span class="status-text">⚡ Motor de Datos: Base de Datos Interna en el Celular (Activa Sin Servidor)</span>
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportarBackup()">📤 Guardar Copia (.json)</button>
                <button class="btn-backup" onclick="document.getElementById('importarInput').click()">📥 Cargar Copia (.json)</button>
                <input type="file" id="importarInput" accept=".json" style="display: none;" onchange="importarBackup(this)">
            </div>
        </div>

        <!-- INVERSIÓN TOTAL -->
        <div class="card-inversion">
            <div class="card-inversion-info">
                <h3>Inversión Total en Equipos</h3>
                <div class="monto" id="totalInversion">Q0.00</div>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <main class="card-formulario">
            <h2><span>+</span> Registrar Nuevo Equipo</h2>
            <form id="formInventario">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombreEquipo">Nombre del Equipo</label>
                        <input type="text" id="nombreEquipo" placeholder="Ej. Bocina Behringer B15X" required>
                    </div>
                    <div class="form-group">
                        <label for="categoriaEquipo">Categoría</label>
                        <select id="categoriaEquipo">
                            <option value="Audio">Audio</option>
                            <option value="Iluminación">Iluminación</option>
                            <option value="Estructuras">Estructuras</option>
                            <option value="Accesorios / Cables">Accesorios / Cables</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="precioUnitario">Precio Unitario (Q)</label>
                        <input type="number" id="precioUnitario" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="cantidadEquipo">Cantidad</label>
                        <input type="number" id="cantidadEquipo" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="fechaCompra">Fecha de Compra</label>
                        <input type="date" id="fechaCompra" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Foto del Equipo</label>
                        <div class="file-input-wrapper">
                            <label for="fotoEquipo" id="labelFoto">Seleccionar archivo...</label>
                            <input type="file" id="fotoEquipo" accept="image/*">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar en Dispositivo</button>
            </form>
        </main>

        <!-- LISTADO DE EQUIPOS -->
        <section class="card-lista">
            <h2>📋 Equipos en Inventario</h2>
            <div class="equipos-container" id="equiposLista"></div>
        </section>
    </div>

    <script>
        let db;
        let fotoBase64 = "";
        document.getElementById('fechaCompra').valueAsDate = new Date();

        // 1. INICIALIZAR INDEXEDDB
        const request = indexedDB.open("LasserBeatsInventarioDB", 1);

        request.onerror = function(event) {
            console.error("Error al abrir IndexedDB", event);
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            cargarInventario();
        };

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            const objectStore = db.createObjectStore("equipos", { keyPath: "id", autoIncrement: true });
            objectStore.createIndex("nombre", "nombre", { unique: false });
        };

        // Captura de Foto a Base64
        document.getElementById('fotoEquipo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('labelFoto').textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(event) { fotoBase64 = event.target.result; };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('labelFoto').textContent = "Seleccionar archivo...";
                fotoBase64 = "";
            }
        });

        function formatearFecha(fechaStr) {
            if(!fechaStr) return "N/A";
            const partes = fechaStr.split("-");
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
        }

        // 2. LEER DATOS
        function cargarInventario() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                renderizarEquipos(event.target.result);
            };
        }

        function renderizarEquipos(equipos) {
            const container = document.getElementById('equiposLista');
            container.innerHTML = "";
            let total = 0;

            if (equipos.length === 0) {
                container.innerHTML = `<div class="sin-equipos">No hay equipos registrados en este dispositivo.</div>`;
                document.getElementById('totalInversion').textContent = "Q0.00";
                return;
            }

            equipos.forEach(equipo => {
                const subtotal = equipo.precio * equipo.cantidad;
                total += subtotal;

                const html = `
                    <div class="equipo-item">
                        <div class="equipo-foto-container">
                            ${equipo.foto ? `<img src="${equipo.foto}">` : `<span class="equipo-foto-placeholder">📷</span>`}
                        </div>
                        <div class="equipo-detalles">
                            <div class="equipo-titulo">${equipo.nombre}</div>
                            <div class="equipo-meta">
                                <span><strong>Categoría:</strong> ${equipo.categoria}</span>
                                <span><strong>Cantidad:</strong> ${equipo.cantidad}</span>
                                <span><strong>Compra:</strong> ${formatearFecha(equipo.fecha)}</span>
                                <span><strong>Precio:</strong> Q${equipo.precio.toFixed(2)}</span>
                            </div>
                            <div class="equipo-precio-total">Subtotal: Q${subtotal.toFixed(2)}</div>
                        </div>
                        <button class="btn-eliminar" onclick="eliminarEquipo(${equipo.id})">🗑️ Eliminar</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('totalInversion').textContent = `Q${total.toFixed(2)}`;
        }

        // 3. AGREGAR REGISTRO
        document.getElementById('formInventario').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoEquipo = {
                nombre: document.getElementById('nombreEquipo').value,
                categoria: document.getElementById('categoriaEquipo').value,
                precio: parseFloat(document.getElementById('precioUnitario').value),
                cantidad: parseInt(document.getElementById('cantidadEquipo').value),
                fecha: document.getElementById('fechaCompra').value,
                foto: fotoBase64
            };

            const transaction = db.transaction(["equipos"], "readwrite");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.add(nuevoEquipo);

            request.onsuccess = function() {
                document.getElementById('formInventario').reset();
                document.getElementById('fechaCompra').valueAsDate = new Date();
                document.getElementById('labelFoto').textContent = "Seleccionar archivo...";
                fotoBase64 = "";
                cargarInventario();
            };
        });

        // 4. ELIMINAR REGISTRO
        function eliminarEquipo(id) {
            if (confirm("¿Estás seguro de eliminar este equipo de la memoria local?")) {
                const transaction = db.transaction(["equipos"], "readwrite");
                const objectStore = transaction.objectStore("equipos");
                const request = objectStore.delete(id);

                request.onsuccess = function() {
                    cargarInventario();
                };
            }
        }

        // 5. EXPORTAR BACKUP
        function exportarBackup() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                const equipos = event.target.result;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(equipos, null, 2));
                const descargaAnchor = document.createElement('a');
                descargaAnchor.setAttribute("href", dataStr);
                descargaAnchor.setAttribute("download", "backup_inventario_lasser.json");
                document.body.appendChild(descargaAnchor);
                descargaAnchor.click();
                descargaAnchor.remove();
            };
        }

        // 6. IMPORTAR BACKUP
        function importarBackup(input) {
            const file = input.files[0];
            if (!file) return;

            if (!confirm("Atención: Al importar se borrará la base local actual para cargar los datos nuevos. ¿Continuar?")) {
                input.value = "";
                return;
            }

            const lector = new FileReader();
            lector.onload = function(evento) {
                try {
                    const datosImportados = JSON.parse(evento.target.result);
                    const transaction = db.transaction(["equipos"], "readwrite");
                    const objectStore = transaction.objectStore("equipos");
                    const clearRequest = objectStore.clear();
                    
                    clearRequest.onsuccess = function() {
                        datosImportados.forEach(e => {
                            delete e.id; 
                            objectStore.add(e);
                        });
                        
                        transaction.oncomplete = function() {
                            alert("¡Inventario cargado exitosamente en este dispositivo!");
                            cargarInventario();
                        };
                    };
                } catch (err) {
                    alert("Error al procesar el archivo de copia.");
                }
                input.value = "";
            };
            lector.readAsText(file);
        }

        // --- REGISTRO DEL SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Asistente offline activado con éxito', reg))
                    .catch(err => console.error('Error al activar el asistente offline', err));
            });
        }
    </script>
</body>
</html>
