<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e676">
    <title>Inventario Permanente - Lasser Beats</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="logo.jpg">

    <style>
        /* --- VARIABLES DE DISEÑO Y TEMA --- */
        :root {
            --bg-principal: #0a0a0a;
            --bg-tarjeta: #121212;
            --bg-input: #1a1a1a;
            --borde: #242424;
            --neon-verde: #00e676;
            --neon-verde-hover: #00b359;
            --rojo-eliminar: #f44336;
            --texto-blanco: #ffffff;
            --texto-gris: #aaaaaa;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
        }
        
        body { 
            background-color: var(--bg-principal); 
            color: var(--texto-blanco); 
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* Contenedor maestro de la App */
        .app-container { 
            width: 100%; 
            max-width: 1500px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        header { 
            text-align: center; 
            padding: 10px 0 5px 0; 
        }
        
        header h1 {
            font-size: 2.2rem; 
            text-shadow: 0 0 12px var(--neon-verde); 
            letter-spacing: 1.5px;
        }

        .subtitle { 
            color: var(--neon-verde); 
            font-size: 0.85rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 8px; 
            font-weight: 600; 
        }
        
        /* --- BARRA DE CONFIGURACIÓN SUPERIOR --- */
        .card-server-status { 
            background-color: var(--bg-tarjeta); 
            border: 1px solid #1f2c25; 
            border-radius: 12px; 
            padding: 15px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .status-text { 
            font-size: 0.9rem; 
            font-weight: 500; 
            color: var(--neon-verde); 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .backup-controls { 
            display: flex; 
            gap: 10px; 
        }
        
        .btn-backup {
            background-color: var(--bg-input); 
            border: 1px solid var(--borde); 
            color: var(--texto-blanco);
            padding: 8px 14px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            border-radius: 6px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: all 0.2s ease;
        }
        
        .btn-backup:hover { 
            background-color: var(--neon-verde); 
            color: #000000; 
            border-color: var(--neon-verde); 
        }
        
        /* --- DISEÑO PRINCIPAL EN DOS COLUMNAS (PC) --- */
        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr; /* Columna izquierda fija para control, derecha para catálogo */
            gap: 20px;
            align-items: start;
        }

        .sidebar-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 20px; /* Se queda fijo al hacer scroll en computadoras */
        }

        /* Tarjeta de Inversión */
        .card-inversion { 
            background-color: var(--bg-tarjeta); 
            border: 1px solid var(--borde); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .card-inversion h3 { 
            font-size: 0.85rem; 
            color: var(--texto-gris); 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px; 
        }
        
        .card-inversion .monto { 
            font-size: 2.4rem; 
            font-weight: 700; 
            color: var(--neon-verde); 
        }
        
        /* Formularios y Secciones */
        .card-formulario, .card-lista { 
            background-color: var(--bg-tarjeta); 
            border: 1px solid var(--borde); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .card-formulario h2, .card-lista h2 { 
            font-size: 1.2rem; 
            color: var(--texto-blanco); 
            margin-bottom: 18px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .card-formulario h2 span { color: var(--neon-verde); }
        
        /* Elementos del Formulario */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .form-group label { 
            color: var(--texto-gris); 
            font-size: 0.8rem; 
            font-weight: 500;
        }
        
        .form-group input, .form-group select { 
            background-color: var(--bg-input); 
            border: 1px solid var(--borde); 
            border-radius: 6px; 
            padding: 10px 12px; 
            color: var(--texto-blanco); 
            font-size: 0.95rem; 
            outline: none; 
            width: 100%; 
            transition: border-color 0.2s;
        }
        
        .form-group input:focus, .form-group select:focus { 
            border-color: var(--neon-verde); 
        }
        
        .file-input-wrapper { 
            border: 1px dashed var(--borde); 
            border-radius: 6px; 
            padding: 12px; 
            text-align: center; 
            background-color: var(--bg-input); 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .file-input-wrapper:hover { border-color: var(--neon-verde); }
        
        .file-input-wrapper input[type="file"] { display: none; }
        .file-input-wrapper label { cursor: pointer; color: var(--texto-gris); font-size: 0.85rem; }
        
        .btn-submit { 
            background-color: var(--neon-verde); 
            color: #000000; 
            border: none; 
            border-radius: 6px; 
            padding: 12px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: var(--neon-verde-hover); }
        
        /* --- REJILLA TOTALMENTE ADAPTATIVA --- */
        .equipos-container { 
            display: grid; 
            /* Define que las columnas se calculen solas según el ancho disponible en tiempo real */
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 16px; 
        }
        
        /* Diseño Tarjeta */
        .equipo-item { 
            background-color: var(--bg-input); 
            border: 1px solid var(--borde); 
            border-radius: 8px; 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            gap: 12px;
        }
        
        .equipo-foto-container { 
            width: 100%; 
            height: 150px; 
            border-radius: 6px; 
            background-color: var(--bg-principal); 
            border: 1px solid var(--borde); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        
        .equipo-foto-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .equipo-foto-placeholder { color: #333; font-size: 1.8rem; }
        
        .equipo-detalles { display: flex; flex-direction: column; gap: 4px; }
        .equipo-titulo { font-size: 1.05rem; font-weight: 600; color: var(--texto-blanco); line-height: 1.3; }
        
        .equipo-meta { 
            font-size: 0.8rem; 
            color: var(--texto-gris); 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            margin-top: 4px;
        }
        .equipo-meta strong { color: #777777; }
        
        .equipo-precio-total { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--neon-verde); 
            border-top: 1px solid var(--borde);
            padding-top: 8px;
        }
        
        .btn-eliminar { 
            background-color: rgba(244, 67, 54, 0.08); 
            border: 1px solid rgba(244, 67, 54, 0.15); 
            color: var(--rojo-eliminar); 
            border-radius: 6px; 
            padding: 8px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            cursor: pointer; 
            text-align: center;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-eliminar:hover { background-color: var(--rojo-eliminar); color: var(--texto-blanco); }
        
        .sin-equipos { 
            text-align: center; 
            color: #555555; 
            padding: 50px 0; 
            grid-column: span 10;
            font-size: 0.95rem;
        }

        /* --- MEDIA QUERIES (REDIRECCIÓN DE PANTALLAS TÁCTILES Y MÓVILES) --- */
        
        /* Para pantallas medianas (Tablets o Laptops pequeñas) */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 320px 1fr;
            }
        }

        /* Para pantallas móviles (Se transforma todo a una sola columna vertical fluida) */
        @media (max-width: 850px) {
            body { padding: 12px; }
            .card-server-status { flex-direction: column; text-align: center; align-items: stretch; }
            .backup-controls { flex-direction: column; }
            .btn-backup { justify-content: center; padding: 10px; }
            
            .main-layout {
                grid-template-columns: 1fr; /* Una columna para todo */
            }
            .sidebar-panel {
                position: relative;
                top: 0;
            }
            .equipos-container {
                grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            .equipos-container {
                grid-template-columns: 1fr; /* Tarjetas completas a lo ancho en móviles pequeños */
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>LASSER BEATS</h1>
            <div class="subtitle">Control Operativo de Inventario</div>
        </header>

        <!-- BARRA SUPERIOR DE RESPALDOS -->
        <div class="card-server-status">
            <span class="status-text">⚡ Sistema Local Activo (Base de Datos Blindada Offline)</span>
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportarBackup()">📤 Guardar Copia (.json)</button>
                <button class="btn-backup" onclick="document.getElementById('importarInput').click()">📥 Cargar Copia (.json)</button>
                <input type="file" id="importarInput" accept=".json" style="display: none;" onchange="importarBackup(this)">
            </div>
        </div>

        <!-- LAYOUT MAESTRO RESPONSIVO -->
        <div class="main-layout">
            
            <!-- PANEL LATERAL IZQUIERDO (Estadísticas e Ingreso) -->
            <div class="sidebar-panel">
                <!-- Inversión -->
                <div class="card-inversion">
                    <h3>Inversión Acumulada</h3>
                    <div class="monto" id="totalInversion">Q0.00</div>
                </div>

                <!-- Formulario -->
                <main class="card-formulario">
                    <h2><span>+</span> Registrar Equipo</h2>
                    <form id="formInventario" class="form-container">
                        <div class="form-group">
                            <label for="nombreEquipo">Nombre del Equipo / Modelo</label>
                            <input type="text" id="nombreEquipo" placeholder="Ej. Bocina Behringer B15X" required>
                        </div>
                        <div class="form-group">
                            <label for="categoriaEquipo">Categoría</label>
                            <select id="categoriaEquipo">
                                <option value="Audio">Audio</option>
                                <option value="Iluminación">Iluminación</option>
                                <option value="Estructuras">Estructuras</option>
                                <option value="Accesorios / Cables">Accesorios / Cables</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="precioUnitario">Precio Unitario (Q)</label>
                            <input type="number" id="precioUnitario" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="cantidadEquipo">Cantidad de Unidades</label>
                            <input type="number" id="cantidadEquipo" value="1" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="fechaCompra">Fecha de Compra</label>
                            <input type="date" id="fechaCompra" required>
                        </div>
                        <div class="form-group">
                            <label>Fotografía de Control</label>
                            <div class="file-input-wrapper">
                                <label for="fotoEquipo" id="labelFoto">📷 Capturar o Elegir Imagen</label>
                                <input type="file" id="fotoEquipo" accept="image/*">
                            </div>
                        </div>
                        <button type="submit" class="btn-submit">Guardar en Base Local</button>
                    </form>
                </main>
            </div>

            <!-- PANEL DERECHO EXTENDIDO (Catálogo de Equipos) -->
            <section class="card-lista">
                <h2>📋 Galería de Equipos en Resguardo</h2>
                <div class="equipos-container" id="equiposLista"></div>
            </section>

        </div>
    </div>

    <script>
        let db;
        let fotoBase64 = "";
        document.getElementById('fechaCompra').valueAsDate = new Date();

        // Inicializar IndexedDB de manera segura
        const request = indexedDB.open("LasserBeatsInventarioDB", 1);

        request.onerror = function(event) {
            console.error("Error en base de datos local", event);
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            cargarInventario();
        };

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            const objectStore = db.createObjectStore("equipos", { keyPath: "id", autoIncrement: true });
            objectStore.createIndex("nombre", "nombre", { unique: false });
        };

        // Procesador de imágenes
        document.getElementById('fotoEquipo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('labelFoto').textContent = "✓ " + file.name;
                const reader = new FileReader();
                reader.onload = function(event) { fotoBase64 = event.target.result; };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('labelFoto').textContent = "📷 Capturar o Elegir Imagen";
                fotoBase64 = "";
            }
        });

        function formatearFecha(fechaStr) {
            if(!fechaStr) return "N/A";
            const partes = fechaStr.split("-");
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
        }

        function cargarInventario() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                renderizarEquipos(event.target.result);
            };
        }

        // Renderizado fluido de tarjetas
        function renderizarEquipos(equipos) {
            const container = document.getElementById('equiposLista');
            container.innerHTML = "";
            let total = 0;

            if (equipos.length === 0) {
                container.innerHTML = `<div class="sin-equipos">No hay equipos registrados en el almacenamiento local de este dispositivo.</div>`;
                document.getElementById('totalInversion').textContent = "Q0.00";
                return;
            }

            equipos.forEach(equipo => {
                const subtotal = equipo.precio * equipo.cantidad;
                total += subtotal;

                const html = `
                    <div class="equipo-item">
                        <div>
                            <div class="equipo-foto-container">
                                ${equipo.foto ? `<img src="${equipo.foto}" alt="Equipo">` : `<span class="equipo-foto-placeholder">📷</span>`}
                            </div>
                            <div class="equipo-detalles">
                                <div class="equipo-titulo" style="margin-top: 10px;">${equipo.nombre}</div>
                                <div class="equipo-meta">
                                    <span><strong>Categoría:</strong> ${equipo.categoria}</span>
                                    <span><strong>Cantidad:</strong> ${equipo.cantidad} u.</span>
                                    <span><strong>Compra:</strong> ${formatearFecha(equipo.fecha)}</span>
                                    <span><strong>Costo U:</strong> Q${equipo.precio.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="equipo-precio-total">Subtotal: Q${subtotal.toFixed(2)}</div>
                            <button class="btn-eliminar" style="margin-top: 10px;" onclick="eliminarEquipo(${equipo.id})">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('totalInversion').textContent = `Q${total.toFixed(2)}`;
        }

        // Guardar elementos en base de datos
        document.getElementById('formInventario').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoEquipo = {
                nombre: document.getElementById('nombreEquipo').value,
                categoria: document.getElementById('categoriaEquipo').value,
                precio: parseFloat(document.getElementById('precioUnitario').value),
                cantidad: parseInt(document.getElementById('cantidadEquipo').value),
                fecha: document.getElementById('fechaCompra').value,
                foto: fotoBase64
            };

            const transaction = db.transaction(["equipos"], "readwrite");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.add(nuevoEquipo);

            request.onsuccess = function() {
                document.getElementById('formInventario').reset();
                document.getElementById('fechaCompra').valueAsDate = new Date();
                document.getElementById('labelFoto').textContent = "📷 Capturar o Elegir Imagen";
                fotoBase64 = "";
                cargarInventario();
            };
        });

        function eliminarEquipo(id) {
            if (confirm("¿Estás seguro de eliminar este equipo?")) {
                const transaction = db.transaction(["equipos"], "readwrite");
                const objectStore = transaction.objectStore("equipos");
                const request = objectStore.delete(id);

                request.onsuccess = function() {
                    cargarInventario();
                };
            }
        }

        // Sistema Logístico de Respaldos
        function exportarBackup() {
            const transaction = db.transaction(["equipos"], "readonly");
            const objectStore = transaction.objectStore("equipos");
            const request = objectStore.getAll();

            request.onsuccess = function(event) {
                const equipos = event.target.result;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(equipos, null, 2));
                const descargaAnchor = document.createElement('a');
                descargaAnchor.setAttribute("href", dataStr);
                descargaAnchor.setAttribute("download", "backup_inventario_lasser.json");
                document.body.appendChild(descargaAnchor);
                descargaAnchor.click();
                descargaAnchor.remove();
            };
        }

        function importarBackup(input) {
            const file = input.files[0];
            if (!file) return;

            if (!confirm("Atención: Se reemplazará la base local por los datos del archivo. ¿Deseas continuar?")) {
                input.value = "";
                return;
            }

            const lector = new FileReader();
            lector.onload = function(evento) {
                try {
                    const datosImportados = JSON.parse(evento.target.result);
                    const transaction = db.transaction(["equipos"], "readwrite");
                    const objectStore = transaction.objectStore("equipos");
                    const clearRequest = objectStore.clear();
                    
                    clearRequest.onsuccess = function() {
                        datosImportados.forEach(e => {
                            delete e.id; 
                            objectStore.add(e);
                        });
                        
                        transaction.oncomplete = function() {
                            alert("¡Copia de seguridad restaurada correctamente!");
                            cargarInventario();
                        };
                    };
                } catch (err) {
                    alert("Error: El archivo no es un respaldo válido.");
                }
                input.value = "";
            };
            lector.readAsText(file);
        }

        // Service Worker Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker cargado', reg))
                    .catch(err => console.error('Error en Service Worker', err));
            });
        }
    </script>
</body>
</html>
